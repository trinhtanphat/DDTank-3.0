name: DDTank30 Contract CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: DDTank30 source contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run source-contract gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'Test-DDTank30BuildStrategy.ps1',
            'Test-DDTank30Clr2RuntimeGuard.ps1',
            'Test-DDTank30DatabaseSource.ps1',
            'Test-DDTank30DbAuth.ps1',
            'Test-DDTank30GameServerProject.ps1',
            'Test-DDTank30LegacyScriptSyntax.ps1',
            'Test-DDTank30Isolation.ps1',
            'Test-DDTank30WcfIsolation.ps1',
            'Test-DDTank30WebInstaller.ps1',
            'Test-DDTank30BallListCache.ps1',
            'Test-DDTank30RuntimeWebAssets.ps1',
            'Test-DDTank30WeeklyAssets.ps1',
            'Test-DDTank30FirstLoginFlow.ps1',
            'Test-DDTank30SingleSourceConfig.ps1',
            'Test-DDTank30PveLoadingGpPenalty.ps1',
            'Test-DDTank30PveScriptCoverage.ps1',
            'Test-DDTank30PvpReadyStart.ps1',
            'Test-DDTank30ClientWindAimPatcher.ps1',
            'Test-DDTank30Barry34BrainHookCompat.ps1',
            'Test-DDTank30Barry34BrainHookBackport.ps1',
            'Test-DDTank30PhysicsProperties1Compat.ps1',
            'Test-DDTank30Barry34DarkCastleProperties1.ps1',
            'Test-DDTank30Gunny92CompatBackport.ps1',
            'Test-DDTank30YutiCompatBackport.ps1',
            'Test-DDTank30SkelletonxCompatBackport.ps1',
            'Test-DDTank30BaseGunnyCompatBackport.ps1',
            'Test-DDTank30ReferenceSourceSync.ps1',
            'Test-DDTank30QuestRewardCapacity.ps1',
            'Test-DDTank30WebRootPublicHost.ps1'
          )
          foreach ($name in $tests) {
            Write-Host "=== $name ==="
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests\ops' $name)
            if ($LASTEXITCODE -ne 0) { throw "$name failed with exit $LASTEXITCODE" }
          }


  pvp-smart-bot:
    name: DDTank30 smart bot build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run smart bot contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'tests/pvp-smart-bot-smoke.ps1',
            'tests/pvp-bot-terrain-clear-smoke.ps1',
            'tests/terrain-character-settle-smoke.ps1',
            'tests/v30-bot-wind-aim-smoke.ps1'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit $LASTEXITCODE" }
          }

      - name: Build Game.Logic and Fighting.Server
        shell: powershell
        run: |
          msbuild ./Game.Logic/Game.Logic.csproj /t:Build /p:Configuration=Release /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild ./Fighting.Server/Fighting.Server.csproj /t:Build /p:Configuration=Release /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate CLR2 runtime references
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'ddtank30-clr2'
          New-Item -ItemType Directory -Force -Path (Join-Path $runtime 'game'), (Join-Path $runtime 'fighting') | Out-Null
          Copy-Item 'Game.Logic/bin/Release/Game.Logic.dll' (Join-Path $runtime 'game/Game.Logic.dll')
          Copy-Item 'Game.Logic/bin/Release/Game.Logic.dll' (Join-Path $runtime 'fighting/Game.Logic.dll')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'deploy/Test-DDTank30Clr2Runtime.ps1' -RuntimeRoot $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smart bot Fight artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddtank30-smart-bot-fight
          path: |
            Game.Logic/bin/Release/Game.Logic.dll
            Fighting.Server/bin/Release/Fighting.Server.dll
          if-no-files-found: error
