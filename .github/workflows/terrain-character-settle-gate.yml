name: Terrain character settle gate

on:
  pull_request:
    paths:
      - "Game.Logic/**"
      - "tests/terrain-character-settle-smoke.ps1"
      - ".github/workflows/terrain-character-settle-gate.yml"
      - "deploy/Build-DDTank30GameLogicClr2.ps1"
  workflow_dispatch:

jobs:
  terrain-settle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run terrain settle smoke
        shell: powershell
        run: ./tests/terrain-character-settle-smoke.ps1

      - name: Build Game.Logic
        shell: powershell
        run: ./deploy/Build-DDTank30GameLogicClr2.ps1

      - name: Upload Game.Logic artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrain-settle-gamelogic-v30
          path: |
            Game.Logic/bin/Release/Game.Logic.dll
            Game.Logic/bin/Release/Game.Logic.pdb
          if-no-files-found: error
